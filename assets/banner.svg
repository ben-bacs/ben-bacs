  </text>

  <text x="450" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#A1A1AA">
    <tspan fill="#E5C396">Backend &amp; Systems</tspan>  ·  <tspan fill="#E5C396">Native Rust &amp; Go</tspan>  ·  <tspan fill="#E5C396">Edge Cloud</tspan>  ·  <tspan fill="#E5C396">AppSec &amp; CCNA</tspan>
