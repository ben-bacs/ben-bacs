<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0C" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#E5C396" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C396" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5C396" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E5C396" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="900" height="140" rx="12" fill="url(#bg)" stroke="#27272A" stroke-width="1.2" />
