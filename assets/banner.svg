<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0C" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#E5C396" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C396" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5C396" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#E5C396" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="180" rx="14" fill="url(#bg)" stroke="#27272A" stroke-width="1.5" />
  <rect width="900" height="180" rx="14" fill="url(#grid)" />
  <rect width="900" height="180" rx="14" fill="url(#glow)" />

  <!-- Top Gold Accent Line -->
  <rect x="150" y="0" width="600" height="1.5" fill="url(#goldLine)" />

  <!-- Terminal Status Pill -->
  <g transform="translate(335, 24)">
    <rect width="230" height="24" rx="12" fill="#161618" stroke="#27272A" stroke-width="1" />
    <circle cx="16" cy="12" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#D4D4D8" letter-spacing="0.8">
      SYSTEMS &amp; SECURITY ENGINEER
    </text>
  </g>

  <!-- Main Name -->
  <text x="450" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Benedict Neil D. Bacud
  </text>

  <!-- Subtitle with Gold Accents -->
  <text x="450" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#A1A1AA">
    <tspan fill="#E5C396" font-weight="600">Backend Architecture</tspan>  ·  <tspan fill="#E5C396" font-weight="600">Native Rust &amp; Go</tspan>  ·  <tspan fill="#E5C396" font-weight="600">Edge Runtimes</tspan>  ·  <tspan fill="#E5C396" font-weight="600">AppSec &amp; CCNA</tspan>
  </text>

  <!-- Bottom Telemetry Bar -->
  <text x="450" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#71717A" letter-spacing="0.4">
    [ Java 25 · Spring Boot 4 · Rust / Tauri 2 · Go 1.24 · TypeScript · PostgreSQL RLS · Cloudflare D1 ]
  </text>
</svg>
