  <rect x="200" y="0" width="500" height="1.5" fill="url(#goldLine)" />

  <text x="450" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-0.4">
